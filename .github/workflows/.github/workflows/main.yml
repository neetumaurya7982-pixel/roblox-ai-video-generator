
name: Roblox Video Generator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Story topic"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg

      - name: Run video generator
        run: |
          blender -b --python video_generator.py -- --topic "${{ inputs.topic }}"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: roblox-video
          path: output/*.mp4
          if-no-files-found: error
